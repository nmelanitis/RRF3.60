[project]
name = "crawld"
version = "0.1.0"
description = "Evidence-backed analysis of Greek Recovery and Resilience Facility records"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2026.9.9",
    "pypdf>=6.21.4,<7",
]

[project.scripts]
crawld = "crawld.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawld"]

